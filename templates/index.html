<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Multi Language Compiler</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <header>

            <div class="logo">
                ⚡
            </div>

            <div>
                <h1>Code Compiler</h1>
                <p>Multi-language compilation and execution</p>
            </div>

        </header>


        <form
            action="/run"
            method="POST"
        >

            <div class="toolbar">

                <label for="language">
                    Select Language
                </label>

                <select
                    name="language"
                    id="language"
                >

                    <option value="c"
                        {% if language == "c" %}selected{% endif %}>
                        C
                    </option>

                    <option value="cpp"
                        {% if language == "cpp" %}selected{% endif %}>
                        C++
                    </option>

                    <option value="python"
                        {% if language == "python" %}selected{% endif %}>
                        Python
                    </option>

                    <option value="java"
                        {% if language == "java" %}selected{% endif %}>
                        Java
                    </option>

                </select>

            </div>


            <div class="editor">

                <textarea
                    name="code"
                    spellcheck="false"
                    placeholder="Enter your code here..."
                >{{ code or '' }}</textarea>

            </div>


            <button type="submit">
                ▶ Run Code
            </button>

        </form>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if status %}

        <section class="result">

            <div class="result-header">

                <h2>Execution Result</h2>

                <span class="
                    {% if 'Successfully' in status %}
                        success
                    {% else %}
                        failed
                    {% endif %}
                ">
                    {{ status }}
                </span>

            </div>

            <pre>{{ output }}</pre>

        </section>

        {% endif %}


        <div class="supported">

            <h3>Supported Languages</h3>

            <div class="languages">

                <span>🇨 C</span>
                <span>⚙ C++</span>
                <span>🐍 Python</span>
                <span>☕ Java</span>

            </div>

        </div>

    </div>

</body>

</html>
